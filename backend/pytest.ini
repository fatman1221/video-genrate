[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认跳过 gpu 标记的用例（需要真实 GPU / ComfyUI），显式跑： -m gpu
addopts = -q --strict-markers -m "not gpu"
markers =
    gpu: 需要真实 GPU / ComfyUI 的用例（默认不跑，用 -m gpu 显式选择）
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx. with .starlette.testclient. is deprecated:Warning
